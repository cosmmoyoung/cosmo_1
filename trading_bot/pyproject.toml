[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Thesis-driven research and trading bot: news -> industry -> company -> deep dive -> risk-checked orders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8,<2",
    "pydantic>=2.6",
    "pyyaml>=6",
    "requests>=2.31",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
ibkr = ["ib_async>=1.0"]
pdf = ["pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
